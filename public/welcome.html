<!doctype html><html><head><title>Preparando</title><link rel="stylesheet" href="/welcome.css"></head><body><div class="box"><h1 id="hello">Bem-vindo</h1><p class="role" id="role"></p><p>Estamos preparando suas permissões e seu painel.</p><div class="loader"></div><p>Estamos preparando as coisas, acalme-se...</p></div><script>const d=JSON.parse(localStorage.getItem('ifj_welcome')||'{}');document.getElementById('hello').textContent='Bem-vindo, '+(d.username||'membro');document.getElementById('role').textContent='Patente: '+(d.role||'');
let tasks=['Carregando permissões...','Sincronizando sua patente...','Preparando seu painel...'];let i=0;const text=document.querySelector('.box p:nth-of-type(2)');const timer=setInterval(()=>{text.textContent=tasks[i]||'Finalizando preparação...';i++;},1000);fetch('/api/auth/complete-welcome',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'}}).finally(()=>{setTimeout(()=>{clearInterval(timer);localStorage.removeItem('ifj_welcome');location='/painel';},5000)});</script></body></html>
